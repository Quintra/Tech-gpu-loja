<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech GPU - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <section id="login-container">
        <div class="login-box">
            <div class="tech-gpu-header" style="border: none; text-align: center; padding: 0; margin-bottom: 20px;">
                <span class="tech-tag">Bem vindo</span>
                <h2 style="font-size: 2.2rem;">TECH <span class="highlight">GPU</span></h2>
            </div>
            
            <h1>Acesso do Cliente</h1>
            <p>Insira suas credenciais para continuar</p>
        
            <form id="login-form-cliente">
                <input type="text" placeholder="Usuário ou CPF" required>
                <input type="password" placeholder="Senha" required>
                <button type="submit" class="btn-primary">Entrar no Sistema</button>
            </form>
            
            <a href="cadastro_clientes.html" class="btn-voltar">Cadastrar novo usuário</a>
            <a class="btn-voltar" onclick="window.location.href='index.html'">Voltar</a>
        </div>

<script>
    // Seleciona o formulário de forma resiliente (com ou sem ID no HTML)
    const formulario = document.getElementById('login-form-cliente') || document.querySelector('form');

    if (formulario) {
        formulario.onsubmit = function(e) {
            e.preventDefault();
            
            const inputs = this.querySelectorAll('input');
            const userIn = inputs[0].value.trim().toLowerCase();
            const passIn = inputs[1].value.trim();
            
            // Uniâo das tabelas para garantir compatibilidade com cadastros antigos
            const clientes = JSON.parse(localStorage.getItem('techGpuClientes')) || [];
            const equipe = JSON.parse(localStorage.getItem('techGpuEquipe')) || [];
            const todosUsuarios = [...clientes, ...equipe];
            
            // Procura o usuário por Nome, Usuário ou CPF
            const usuarioValido = todosUsuarios.find(u => {
                const nomeBate = (u.nome && u.nome.trim().toLowerCase() === userIn) || 
                                 (u.user && u.user.trim().toLowerCase() === userIn);
                const cpfBate = u.cpf && u.cpf.replace(/\D/g, '') === userIn.replace(/\D/g, '');
                
                return nomeBate || cpfBate;
            });

            if (usuarioValido) {
                // Captura a senha independente se foi salva como 'senha' ou 'pass'
                const senhaSalva = usuarioValido.senha || usuarioValido.pass;
                
                if (senhaSalva) {
                    // Se ele possui uma senha definida, valida ela estritamente
                    if (senhaSalva === passIn) {
                        fazerLogin(usuarioValido);
                        return;
                    }
                } else {
                    // CASO SEJA UM CLIENTE CADASTRADO PELO CRM INTERNO (Sem senha no objeto):
                    // Permite a entrada usando o próprio CPF como senha ou o padrão "123"
                    const cpfComoSenha = usuarioValido.cpf ? usuarioValido.cpf.trim() : null;
                    if (passIn === "123" || (cpfComoSenha && passIn === cpfComoSenha)) {
                        fazerLogin(usuarioValido);
                        return;
                    }
                }
            }
            
            // Se falhar em todas as regras acima
            alert("Usuário, CPF ou senha incorretos!");
            inputs[0].value = '';
            inputs[1].value = '';
        };
    }

    // Função auxiliar para efetivar o login e redirecionar
    function fazerLogin(usuario) {
        const nomeExibicao = usuario.nome || usuario.user || "Cliente";
        localStorage.setItem('clienteLogado', nomeExibicao);
        window.location.href = 'catalogo.html';
    }
</script>
    </section>
</body>
</html>
